<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06102B">
<title>Touchline tour | U15 Blues</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#06102B;--card:#0E1D45;--card2:#15295A;--line:#27407F;--ink:#F4F6FC;--muted:#A6B2D4;--amber:#FFB81C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 2px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.top img{width:48px;height:48px;border-radius:10px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.tabs button[aria-selected=true]{border-color:var(--amber);background:var(--card2)}
video{width:100%;max-height:72vh;background:#000;border-radius:16px;border:2px solid var(--amber);display:block}
.chap{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.chap button{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chap button[aria-current=true]{border-color:var(--amber);background:var(--card2)}
.chap b.n{color:var(--amber);font-size:20px;min-width:22px}
.chap span.t{margin-left:auto;color:var(--amber);font-weight:700}
.btn{display:block;text-align:center;min-height:52px;line-height:52px;border-radius:12px;background:var(--amber);color:#1a1200;font-weight:800;text-decoration:none;margin-top:16px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid rgba(255,184,28,.7);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><img src="icon-192.png" alt=""><div><h1>Touchline tour</h1><p class="muted small" style="margin:0">Wigan Junior Latics U15 Blues</p></div></div>
 <div class="tabs" id="tabs" role="tablist" aria-label="Who is it for" hidden></div>
 <p class="muted small" id="blurb"></p>
 <video id="v" controls playsinline preload="metadata" aria-label="Touchline tour video"></video>
 <p class="small muted" style="margin-top:8px">Captions are on the screen. Tap a section to jump to it.</p>
 <ul class="chap" id="chap"></ul>
 <a class="btn" href="parents.html">Open Touchline</a>
 <div class="card small"><b>Something not working?</b><br>Tell Tim or Deano at training or on the group and we will sort it.</div>
</div>
<script>
(function(){
// Add a guide here when its video is uploaded. Times are in seconds.
var GUIDES=[
 {id:'parents',label:'Parents',src:'guide_parents.mp4',poster:'guide_parents.jpg',vtt:'guide_parents.vtt',
  blurb:'A five minute tour for parents: what it is, how to sign in, alerts, voting, events and asking us questions.',
  ch:[['welcome','Welcome',6.0],['privacy','Your privacy',67.6],['home','Home',87.4],['games','Games',123.4],['events','Events and media',139.6],['motm','Man of the Match',172.3],['alerts','Match day alerts',195.7],['questions','Questions and ideas',214.7],['lad','Your lad\'s page',239.8],['install','Put it on your phone',272.8]]}
];
var v=document.getElementById('v'),cur=null,list=document.getElementById('chap');
function fmt(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
function load(g,at){
 cur=g;v.src=g.src;v.poster=g.poster||'';
 while(v.firstChild)v.removeChild(v.firstChild);
 if(g.vtt){var t=document.createElement('track');t.kind='captions';t.srclang='en-GB';t.label='English';t.src=g.vtt;v.appendChild(t);}
 document.getElementById('blurb').textContent=g.blurb;
 list.innerHTML=g.ch.map(function(c,i){return '<li><button type="button" data-i="'+i+'"><b class="n">'+(i+1)+'</b><span>'+c[1]+'</span><span class="t">'+fmt(c[2])+'</span></button></li>';}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.id===g.id?'true':'false');});
 if(at!=null)seek(at,false);
}
function seek(i,play){
 var c=cur.ch[i];if(!c)return;
 function go(){v.currentTime=c[2];if(play!==false){var p=v.play();if(p&&p.catch)p.catch(function(){});}mark(i);}
 if(v.readyState>0)go();else v.addEventListener('loadedmetadata',function f(){v.removeEventListener('loadedmetadata',f);go();});
}
function mark(i){Array.prototype.forEach.call(list.querySelectorAll('button'),function(b,k){if(k===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});}
list.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;seek(+b.dataset.i,true);try{history.replaceState(null,'','#'+cur.ch[+b.dataset.i][0]);}catch(x){}});
v.addEventListener('timeupdate',function(){var k=0;for(var i=0;i<cur.ch.length;i++){if(v.currentTime>=cur.ch[i][2]-0.3)k=i;}mark(k);});
var tabs=document.getElementById('tabs');
if(GUIDES.length>1){tabs.hidden=false;tabs.innerHTML=GUIDES.map(function(g){return '<button type="button" role="tab" data-id="'+g.id+'">'+g.label+'</button>';}).join('');tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var g=GUIDES.filter(function(x){return x.id===b.dataset.id;})[0];if(g)load(g);});}
var want=(location.hash||'').replace('#',''),role=(location.search.match(/[?&]for=(\w+)/)||[])[1];
var g0=GUIDES.filter(function(x){return x.id===role;})[0]||GUIDES[0];
load(g0);
var wi=-1;g0.ch.forEach(function(c,i){if(c[0]===want)wi=i;});
if(wi>-1)seek(wi,true);
})();
</script>
</body>
</html>

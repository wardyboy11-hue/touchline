<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070C18">
<meta name="description" content="Touchline Pro, the match day and session console for Wigan Junior Latics Blues U15.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchline Pro">
<title>Touchline Pro · Wigan Junior Latics Blues U15</title>
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<a class="skiplink" href="#view">Skip to the page</a>

<header class="topbar">
  <button class="club" data-act="go" data-to="#/today" aria-label="Touchline Pro home">
    <img src="../badge.png" alt="" width="34" height="34">
    <span class="club-txt">
      <b>Touchline Pro</b>
      <i id="clubName">Latics Blues U15</i>
    </span>
  </button>
  <div class="topbar-actions">
    <button class="iconbtn" data-act="go" data-to="#/more" aria-label="More tools and guides" title="More">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/></svg>
    </button>
    <button class="iconbtn" data-act="comms" aria-label="Message the team" title="Message the team">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3z"/><path d="M9 12h6"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Sections"></aside>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-grab" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">Details</h2>
      <button class="iconbtn" data-act="closeSheet" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/core.js?v=2"></script>
<script src="js/data.js?v=1"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/views/today.js?v=2"></script>
<script src="js/views/match.js?v=1"></script>
<script src="js/views/sessions.js?v=1"></script>
<script src="js/views/library.js?v=1"></script>
<script src="js/views/squad.js?v=1"></script>
<script src="js/views/comms.js?v=1"></script>
<script src="js/views/guides.js?v=1"></script>
<script src="js/views/roles.js?v=1"></script>
<script src="js/views/attendance.js?v=1"></script>
<script src="js/views/more.js?v=1"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>

<script>(function(){var s=document.getElementById("sprays"),h="";for(var i=0;i<24;i++){var a=i*15*Math.PI/180,x1=120+Math.sin(a)*76,y1=120-Math.cos(a)*76,x2=120+Math.sin(a)*108,y2=120-Math.cos(a)*108;h+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" style="animation-delay:'+(i*2/24).toFixed(2)+'s"/>';}s.innerHTML=h;window.__sp0=Date.now();window.splashDone=function(){var e=document.getElementById("splash");if(!e||e.__d)return;e.__d=1;setTimeout(function(){e.classList.add("off");setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},600);},Math.max(0,1500-(Date.now()-window.__sp0)));};setTimeout(window.splashDone,9000);})();</script>

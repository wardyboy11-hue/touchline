<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>:root{--bg:#06102B;--fg:#F4F6FC;--mut:#A6B2D4;--acc:#FFB81C}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000}
.ctl{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}button,select{background:#1c2733;color:#fff;border:1px solid #33475b;border-radius:8px;padding:10px 14px;font-size:15px}
input[type=range]{flex:1;min-width:140px}h2{color:var(--acc);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 6px}ul{margin:0;padding-left:20px;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}@media(max-width:800px){.grid{grid-template-columns:1fr}}body.render .wrap{padding:0;max-width:none}body.render .ctl,body.render .txt{display:none}#stage{position:relative}#ld{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(6,16,43,.82);border-radius:10px;font-size:16px}#ld i{display:block;width:60%;max-width:360px;height:8px;background:#1d3652;border-radius:4px;overflow:hidden}#ld b{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}button:disabled{opacity:.6}</style></head>
<body><div class="wrap"><div id="stage"><canvas id="cv"></canvas><div id="ld"><span>Getting the voice ready</span><i><b></b></i></div></div>
<div class="ctl"><button id="restart">Restart</button><button id="prev">Back</button><button id="play">Play</button><button id="next">Next step</button><button id="voice">Voice on</button><input id="bar" type="range" min="0" max="1000" value="0"><select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option></select></div>
